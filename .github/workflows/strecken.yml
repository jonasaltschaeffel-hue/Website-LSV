# Holt alle 3 Stunden die Streckenflüge des LSV Regensburg von WeGlide und speichert sie für die
# Karte auf der Seite „Streckenflug“ (daten/strecken/). Manuell starten: Actions → „Streckenflüge“ → Run workflow.
name: Streckenflüge von WeGlide

on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: strecken
  cancel-in-progress: false

jobs:
  holen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Flüge von WeGlide holen
        run: node scripts/strecken.mjs
      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add daten/strecken
          if git diff --cached --quiet; then
            echo "Keine neuen Flüge."
          else
            git commit -m "Streckenflüge von WeGlide aktualisiert"
            git pull --rebase
            git push
          fi
