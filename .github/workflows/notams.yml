# Aktualisiert die Daten der NOTAM-Karte (Seite „Flugvorbereitung“) tagsüber jede Stunde.
# Manuell starten: Reiter „Actions“ → „NOTAMs aktualisieren“ → „Run workflow“.
name: NOTAMs aktualisieren

on:
  schedule:
    - cron: '20 3-19 * * *'   # 3:20–19:20 UTC, also etwa 4–21 Uhr deutscher Zeit
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notams
  cancel-in-progress: false

jobs:
  holen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: NOTAMs holen
        run: node .github/scripts/notams-holen.mjs
      - name: Speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add daten/notams
          if git diff --cached --quiet; then echo "Keine Änderungen"; exit 0; fi
          git commit -m "NOTAMs aktualisiert"
          git pull --rebase
          git push
