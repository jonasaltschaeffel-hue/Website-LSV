# Hält die Artikelkarten auf der Startseite und unter „Alle Meldungen“ automatisch aktuell:
# Datum und Titel kommen aus der jeweiligen Artikelseite, sortiert wird nach Datum (neueste zuerst).
# Läuft bei jeder Änderung unter aktuelles/ – manuell: „Actions“ → „Artikel abgleichen“ → „Run workflow“.
name: Artikel abgleichen

on:
  push:
    branches: [main]
    paths: ['aktuelles/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: artikel
  cancel-in-progress: false

jobs:
  abgleichen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Karten abgleichen
        run: node .github/scripts/artikel-abgleichen.mjs
      - name: Speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add index.html aktuelles/index.html
          if git diff --cached --quiet; then echo "Keine Änderungen"; exit 0; fi
          git commit -m "Artikelkarten automatisch abgeglichen"
          git pull --rebase
          git push
