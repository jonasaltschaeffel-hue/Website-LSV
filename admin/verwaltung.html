<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Verwaltung – LSV Regensburg</title>
<style>
  :root{--navy:#0a2350;--soft:#5a6f88;--line:#e2e8f0;--bg:#f3f6fa}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,"Segoe UI",sans-serif;color:var(--navy);background:var(--bg)}
  header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 20px;background:var(--navy);color:#fff}
  header h1{font-size:19px;margin:0 auto 0 0}
  header a,header button{color:#fff;font:600 14px system-ui,sans-serif;text-decoration:none;background:none;border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:7px 14px;cursor:pointer}
  nav.tabs{display:flex;gap:6px;padding:14px 20px 0;max-width:1100px;margin:0 auto}
  nav.tabs button{font:600 15px system-ui,sans-serif;padding:10px 18px;border:0;border-radius:12px 12px 0 0;background:#dfe6f0;color:var(--navy);cursor:pointer}
  nav.tabs button.on{background:#fff}
  main{max-width:1100px;margin:0 auto;padding:0 20px 60px}
  .panel{background:#fff;border-radius:0 14px 14px 14px;padding:22px;box-shadow:0 8px 30px -18px rgba(10,35,80,.4)}
  .panel h2{margin:0 0 4px;font-size:21px} .hint{color:var(--soft);font-size:14px;margin:0 0 16px}
  .row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
  .row img{width:84px;height:56px;object-fit:cover;border-radius:8px;background:#dfe6f0;flex:none}
  .row .info{flex:1;min-width:0} .row .t{font-weight:600} .row .s{color:var(--soft);font-size:13px}
  .badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:#ffe9a8;color:#6b4d00;margin-left:6px}
  .btns{display:flex;gap:6px;flex-wrap:wrap}
  button.b,a.b{font:600 13px system-ui,sans-serif;padding:7px 12px;border-radius:9px;border:1px solid #c9d4e2;background:#fff;color:var(--navy);cursor:pointer;text-decoration:none}
  button.b:hover,a.b:hover{background:#eef3fa}
  button.b:disabled{opacity:.35;cursor:default}
  button.del{color:#a3261a;border-color:#efc3bd}
  button.main{background:var(--navy);color:#fff;border-color:var(--navy);padding:9px 16px;font-size:14px}
  select,input,textarea{font:inherit;padding:8px 10px;border:1px solid #c9d4e2;border-radius:9px;color:var(--navy);background:#fff}
  .tabrow{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
  .tabrow input{flex:1;min-width:120px} .tabrow select{flex:1.4;min-width:160px}
  .section{margin-top:30px}
  .modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(6,20,45,.55);padding:16px}
  .dialog{width:min(600px,100%);max-height:calc(100vh - 32px);overflow:auto;background:#fff;border-radius:16px;padding:22px}
  .dialog h3{margin:0 0 12px;font-size:20px}
  .dialog label{display:block;font-weight:600;font-size:14px;margin:12px 0 0}
  .dialog label small{display:block;font-weight:400;color:var(--soft)}
  .dialog input,.dialog textarea,.dialog select{display:block;width:100%;margin-top:5px}
  .dialog .cb{display:flex;gap:8px;align-items:center;font-weight:500} .dialog .cb input{width:auto;margin:0}
  .dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
  #busy{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:rgba(255,255,255,.6);font-weight:600;font-size:16px}
  #toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:40;display:none;padding:10px 16px;border-radius:12px;color:#fff;font-weight:600}
  .login{max-width:380px;margin:60px auto;background:#fff;border-radius:16px;padding:26px;box-shadow:0 8px 30px -18px rgba(10,35,80,.4)}
  .login input{width:100%;margin:8px 0 14px}
  .err{color:#a3261a;font-size:14px;min-height:18px}
</style>
</head>
<body>
<header>
  <h1>Verwaltung · LSV Regensburg</h1>
  <a href="../index.html">Zur Website</a>
  <button type="button" id="logout" hidden>Abmelden</button>
</header>
<div id="app"></div>
<div id="busy">Bitte warten … wird bei GitHub gespeichert</div>
<div id="toast"></div>

<script src="../js/lsv-github.js?v=2"></script>
<script src="../js/lsv-cms.js?v=4"></script>
<script src="../js/verwaltung.js?v=3"></script>
</body>
</html>
